version: "3.9"

services:
  # ============================================================================
  # 1. CORE DATA STACK
  # ============================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vayunet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vayunet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vayunet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vayunet_net

  redis:
    image: redis:7.2-alpine
    container_name: vayunet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vayunet_net

  minio:
    image: minio/minio:latest
    container_name: vayunet_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vayunet_net

  # ============================================================================
  # 2. BACKEND & INGESTION SERVICES
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vayunet_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vayunet_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vayunet_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vayunet_net

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vayunet_celery_worker
    restart: unless-stopped
    command: celery -A backend.app.worker worker -l info -c 4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vayunet_db}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - backend
      - redis
    networks:
      - vayunet_net

  # ============================================================================
  # 3. FRONTEND & REVERSE PROXY
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vayunet_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - vayunet_net

  nginx:
    image: nginx:1.25-alpine
    container_name: vayunet_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vayunet_net

  # ============================================================================
  # 4. FEDERATED NETWORK (Full Profile: 3 Isolated Air Nodes + 1 Coordinator)
  # Multi-node deployment on single machine (Honestly labeled)
  # ============================================================================
  fl_coordinator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vayunet_fl_coordinator
    profiles: ["full"]
    command: python -m backend.app.federated.coordinator --port 8005
    ports:
      - "8005:8005"
    networks:
      - vayunet_net

  fl_node_ludhiana:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vayunet_fl_ludhiana
    profiles: ["full"]
    command: python -m backend.app.federated.node --city Ludhiana --port 8001
    ports:
      - "8001:8001"
    volumes:
      - fl_ludhiana_data:/data
    networks:
      - vayunet_net

  fl_node_delhi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vayunet_fl_delhi
    profiles: ["full"]
    command: python -m backend.app.federated.node --city Delhi --port 8002
    ports:
      - "8002:8002"
    volumes:
      - fl_delhi_data:/data
    networks:
      - vayunet_net

  fl_node_lucknow:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vayunet_fl_lucknow
    profiles: ["full"]
    command: python -m backend.app.federated.node --city Lucknow --port 8003
    ports:
      - "8003:8003"
    volumes:
      - fl_lucknow_data:/data
    networks:
      - vayunet_net

networks:
  vayunet_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  fl_ludhiana_data:
  fl_delhi_data:
  fl_lucknow_data:
